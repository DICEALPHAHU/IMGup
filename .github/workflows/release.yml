# 打 tag 就自动发 Release。
#
# 为什么用 Actions 而不是本地传：创建 Release 和上传附件必须走 GitHub REST API，
# 需要 token。用 Actions 的话它自带 GITHUB_TOKEN，维护者不用在本地存任何密钥，
# 也不用把 PAT 交给别人。发布的 jar 由 GitHub 自己从 tag 的源码构建，
# 所以「Release 里的 jar」和「tag 指向的代码」天然一致，不会被本地未提交的改动污染。
#
# 发新版：把下面 RELEASE_NOTES 指的 .github/release-notes.md 改成这一版的内容，
# 然后 git tag -a v1.0.1 -m "..." && git push origin v1.0.1

name: Release

on:
  push:
    tags: ['v*']

# 创建 Release 需要写权限；默认的 GITHUB_TOKEN 是只读的，必须在这里声明。
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 测试不过就不发版。
      - name: 跑测试
        run: bash test.sh

      # build.sh 自己会跑那批产物校验，任何一项不过直接失败。
      - name: 构建
        run: bash build.sh

      # 构建产物的名字带 git 短哈希（ImgUp-1.0.0-abc1234.jar），那是给开发看的。
      # 发布出去的附件换成干净的名字，用户下载下来就是 ImgUp-1.0.0.jar。
      # 代码和 tag 的对应关系由 Release 本身记录，不会丢。
      - name: 整理附件名
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' src/main/resources/plugin.yml | head -1 | tr -d '\r')"
          mkdir -p dist
          cp target/ImgUp-"$version"-*.jar dist/ImgUp-"$version".jar
          sha256sum dist/ImgUp-"$version".jar | tee dist/ImgUp-"$version".jar.sha256
          ls -la dist

      - name: 创建 Release 并上传 jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' src/main/resources/plugin.yml | head -1 | tr -d '\r')"
          gh release create "$GITHUB_REF_NAME" \
            dist/ImgUp-"$version".jar \
            dist/ImgUp-"$version".jar.sha256 \
            --title "ImgUp $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
