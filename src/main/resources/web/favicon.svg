<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    ImgUp 站点图标。

    刻意画成「方块 + 硬边框」的样子，跟 app.css 里那套 Minecraft 风格保持一致
    （2px 硬边框、不用圆角、不用模糊阴影）。用 SVG 而不是 PNG，是因为这个项目
    坚持不引外部图片资源：SVG 本身就是纯文本，体积也比 PNG 小得多。

    配色取自 app.css 的颜色变量：画框用 gold，山和太阳用 accent，背景用 bg-deep。
    （这里不能写出变量名本身，XML 注释里不允许出现两个连续的连字符。）
  -->
  <rect width="32" height="32" fill="#131317"/>
  <!-- 画框：外深内亮，做出 2px 硬边框的立体感 -->
  <rect x="4" y="6" width="24" height="20" fill="#0d0d11"/>
  <rect x="6" y="8" width="20" height="16" fill="#1a1a1f"/>
  <rect x="6" y="8" width="20" height="16" fill="none" stroke="#e0a83c" stroke-width="2"/>
  <!-- 太阳 -->
  <rect x="10" y="11" width="4" height="4" fill="#8fe06a"/>
  <!-- 山：两级方块，保持方块感 -->
  <path d="M8 22 L13 15 L17 22 Z" fill="#6cc04a"/>
  <path d="M14 22 L19 17 L24 22 Z" fill="#3f7a29"/>
  <!-- 地平线 -->
  <rect x="6" y="22" width="20" height="2" fill="#e0a83c"/>
</svg>
