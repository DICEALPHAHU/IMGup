<!DOCTYPE html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>$msg_admin_title · $site_name$msg_site_title_suffix</title>
<meta name="description" content="$msg_site_og_description">
<meta property="og:title" content="$msg_admin_title · $site_name$msg_site_title_suffix">
<meta property="og:description" content="$msg_site_og_description">
<meta property="og:type" content="website">
<!-- theme-color 让手机浏览器的地址栏跟着站点的深色底走 -->
<meta name="theme-color" content="#131317">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">🖼</span>
      <span class="brand-text">$site_name</span>
    </a>
    <nav class="topnav">
      <a href="/">$msg_common_backHome</a>
      <button class="btn btn-sm" type="button" id="logoutBtn" hidden>$msg_site_admin_logout_button</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <div class="page-head">
    <h1 class="page-title">
      <span class="icon" aria-hidden="true">🗂</span>
      <span>$msg_site_admin_heading</span>
    </h1>
    <p class="lede">$msg_site_admin_lede</p>
  </div>

  <!-- 未登录：只显示登录卡片 -->
  <section class="panel" id="loginCard">
    <h2 class="panel-title">$msg_site_admin_login_title</h2>
    <p class="muted">$msg_site_admin_login_hint</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="pw">$msg_site_admin_password_label</label>
        <input class="input" type="password" id="pw" name="password"
               autocomplete="current-password" enterkeyhint="go" required>
      </div>
      <div class="alert alert-error hidden" id="loginMsg" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">$msg_site_admin_login_button</button>
    </form>
  </section>

  <!-- 已登录：统计 + 筛选 + 图片列表 -->
  <section id="dash" hidden>

    <p class="muted" id="stats"></p>

    <div class="tabs" id="tabs">
      <button class="tab is-active" type="button" data-filter="all">
        <span>$msg_site_admin_filter_all</span> <span class="tab-n">0</span></button>
      <button class="tab" type="button" data-filter="pending">
        <span>$msg_site_admin_filter_pending</span> <span class="tab-n">0</span></button>
      <button class="tab" type="button" data-filter="published">
        <span>$msg_site_admin_filter_published</span> <span class="tab-n">0</span></button>
      <button class="tab" type="button" data-filter="rejected">
        <span>$msg_site_admin_filter_rejected</span> <span class="tab-n">0</span></button>
      <button class="btn btn-sm" type="button" id="bulkBtn">$msg_site_admin_bulk_approve</button>

      <span class="adm-view" id="viewTabs">
        <button class="view-btn is-active" type="button" data-view="grid"
                title="$msg_site_admin_viewGrid" aria-label="$msg_site_admin_viewGrid">&#9638;</button>
        <button class="view-btn" type="button" data-view="list"
                title="$msg_site_admin_viewList" aria-label="$msg_site_admin_viewList">&#9776;</button>
      </span>
    </div>

    <div class="alert alert-error hidden" id="listMsg" role="alert"></div>
    <p class="loading" id="listLoading">$msg_site_admin_loading</p>

    <div class="adm-grid" id="grid"></div>

    <p class="muted" id="empty" hidden>$msg_site_admin_empty</p>
  </section>

</main>

<div class="adm-modal adm-lightbox-wrap" id="lightbox" hidden
     title="$msg_site_admin_closePreview" aria-label="$msg_site_admin_closePreview" role="dialog">
  <img id="lightboxImg" alt="">
  <p class="adm-lightbox-caption" id="lightboxCaption"></p>
</div>

<div class="adm-modal" id="confirmBox" hidden>
  <div class="adm-modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <p class="adm-modal-title" id="confirmTitle"></p>
    <p class="muted" id="confirmText"></p>
    <div class="adm-modal-actions">
      <button class="btn" type="button" id="confirmCancel">$msg_common_cancel</button>
      <button class="btn btn-danger" type="button" id="confirmOk">$msg_site_admin_delete</button>
    </div>
  </div>
</div>

<footer class="foot">
  <div class="wrap">
    <p>$msg_site_footer_note</p>
    <p class="foot-copy">$msg_site_footer_copyright</p>
    <p class="foot-plugin"><span>$msg_site_footer_plugin</span> <a href="$plugin_url" target="_blank" rel="noopener noreferrer">$plugin_url</a></p>
    $icp_block
  </div>
</footer>

<script>
(function () {
  'use strict';

  var t = window.IMGUP_I18N.t;
  var STATUS_KEY = {
    pending: 'site.admin_filter_pending',
    published: 'site.admin_filter_published',
    rejected: 'site.admin_filter_rejected'
  };

  var loginCard = document.getElementById('loginCard');
  var dash = document.getElementById('dash');
  var logoutBtn = document.getElementById('logoutBtn');
  var loginForm = document.getElementById('loginForm');
  var loginBtn = document.getElementById('loginBtn');
  var loginMsg = document.getElementById('loginMsg');
  var pw = document.getElementById('pw');
  var stats = document.getElementById('stats');
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var listLoading = document.getElementById('listLoading');
  var listMsg = document.getElementById('listMsg');
  var bulkBtn = document.getElementById('bulkBtn');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  var viewTabs = Array.prototype.slice.call(document.querySelectorAll('.view-btn'));
  var confirmBox = document.getElementById('confirmBox');
  var confirmTitle = document.getElementById('confirmTitle');
  var confirmText = document.getElementById('confirmText');
  var confirmOk = document.getElementById('confirmOk');
  var confirmCancel = document.getElementById('confirmCancel');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');

  // 网格 / 列表两种视图。选择记在 localStorage 里，下次进来还是上次那样。
  var VIEW_KEY = 'imgup_admin_view';
  function savedView() {
    try {
      var v = window.localStorage.getItem(VIEW_KEY);
      return v === 'list' ? 'list' : 'grid';
    } catch (e) {
      return 'grid';
    }
  }
  var state = { filter: 'all', items: [], counts: {}, view: savedView() };

  function show(el) { el.hidden = false; }
  function hide(el) { el.hidden = true; }

  function setMsg(el, text) {
    if (!text) { el.textContent = ''; el.classList.add('hidden'); return; }
    el.textContent = text;
    el.classList.remove('hidden');
  }

  /* 服务端回的是语言中立的 message_key，拿它查当前语言的文案 */
  function serverText(data, fallbackKey) {
    // 查不到的键 t() 会原样返回键名，这里退回本地兜底
    if (data && data.message_key) {
      var resolved = t(data.message_key);
      if (resolved && resolved !== data.message_key) { return resolved; }
    }
    if (fallbackKey) { return t(fallbackKey); }
    if (data && data.message) { return data.message; }
    return '';
  }

  function req(method, url, body) {
    var opts = { method: method, headers: { 'Accept': 'application/json' } };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (data) { return { status: r.status, ok: r.ok, data: data }; });
    });
  }

  /* ---------------------------------------------------------- 登录 */

  function checkAuth() {
    req('GET', '/admin/api/list?filter=all').then(function (r) {
      if (r.status === 401) { showLogin(); return; }
      showDash();
      applyPayload(r.data);
    }).catch(function () {
      showLogin();
    });
  }

  function showLogin() {
    show(loginCard);
    hide(dash);
    hide(logoutBtn);
  }

  function showDash() {
    hide(loginCard);
    show(dash);
    show(logoutBtn);
  }

  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();
    var value = pw.value;
    if (!value) { setMsg(loginMsg, t('site.admin_password_label')); return; }
    loginBtn.disabled = true;
    setMsg(loginMsg, '');
    req('POST', '/admin/api/login', { password: value }).then(function (r) {
      loginBtn.disabled = false;
      if (r.ok && r.data && r.data.ok) {
        pw.value = '';
        showDash();
        loadList();
        return;
      }
      setMsg(loginMsg, serverText(r.data, 'err.bad_password'));
    }).catch(function () {
      loginBtn.disabled = false;
      setMsg(loginMsg, t('common.netError'));
    });
  });

  logoutBtn.addEventListener('click', function () {
    req('POST', '/admin/api/logout', {}).finally(function () {
      state.items = [];
      render();
      showLogin();
    });
  });

  /* ---------------------------------------------------------- 列表 */

  function loadList() {
    show(listLoading);
    setMsg(listMsg, '');
    req('GET', '/admin/api/list?filter=' + encodeURIComponent(state.filter))
      .then(function (r) {
        hide(listLoading);
        if (r.status === 401) { showLogin(); return; }
        if (!r.ok) { setMsg(listMsg, serverText(r.data, 'err.internal')); return; }
        applyPayload(r.data);
      })
      .catch(function () {
        hide(listLoading);
        setMsg(listMsg, t('common.netError'));
      });
  }

  function applyPayload(data) {
    state.items = (data && data.items) || [];
    state.counts = (data && data.counts) || {};
    render();
  }

  function render() {
    var counts = state.counts;
    stats.textContent = t('site.admin_stats', {
      total: counts.total || 0,
      pending: counts.pending || 0,
      published: counts.published || 0,
      rejected: counts.rejected || 0
    });

    tabs.forEach(function (tab) {
      var key = tab.getAttribute('data-filter');
      tab.classList.toggle('is-active', key === state.filter);
      var badge = tab.querySelector('.tab-n');
      if (badge) {
        var n = key === 'all' ? (counts.total || 0) : (counts[key] || 0);
        badge.textContent = n;
      }
    });

    viewTabs.forEach(function (btn) {
      btn.classList.toggle('is-active', btn.getAttribute('data-view') === state.view);
    });

    grid.innerHTML = '';
    grid.className = state.view === 'list' ? 'adm-list' : 'adm-grid';
    empty.hidden = state.items.length > 0;

    if (state.view === 'list') {
      grid.appendChild(listView(state.items));
      return;
    }
    state.items.forEach(function (item) {
      grid.appendChild(card(item));
    });
  }

  /* ------------------------------------------------------ 第二种：列表 */

  /**
   * 文件管理器那种列表：一行一张，缩略图小一点，信息排成列。
   *
   * 图多的时候比卡片好扫 —— 一屏能看到十几行，而且文件名再长也不会把布局撑歪。
   */
  function listView(items) {
    var table = document.createElement('table');
    table.className = 'adm-table';

    var headRow = document.createElement('tr');
    headRow.appendChild(th('', 'adm-col-thumb'));
    headRow.appendChild(th(t('site.admin_colFile')));
    headRow.appendChild(th(t('site.admin_colPlayer')));
    headRow.appendChild(th(t('site.admin_colActions'), 'adm-col-actions'));
    var thead = document.createElement('thead');
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    items.forEach(function (item) {
      tbody.appendChild(row(item));
    });
    table.appendChild(tbody);
    return table;
  }

  function th(label, cls) {
    var el = document.createElement('th');
    if (cls) {
      el.className = cls;
    }
    el.textContent = label;
    return el;
  }

  function row(item) {
    var tr = document.createElement('tr');

    var thumbCell = document.createElement('td');
    thumbCell.className = 'adm-col-thumb';
    thumbCell.appendChild(thumbLink(item, 'adm-row-thumb'));
    tr.appendChild(thumbCell);

    // 文件名 + 昵称（改了昵称的话再带上原始文件名）
    var nameCell = document.createElement('td');
    var name = document.createElement('code');
    name.className = 'adm-name';
    name.textContent = item.name;
    nameCell.appendChild(name);
    var subText = item.nickname || '';
    if (item.original_name && item.original_name !== item.nickname) {
      subText += (subText ? ' · ' : '') + t('common.originalFileName') + ': ' + item.original_name;
    }
    if (subText) {
      var sub = document.createElement('p');
      sub.className = 'adm-meta muted';
      sub.textContent = subText;
      nameCell.appendChild(sub);
    }
    tr.appendChild(nameCell);

    // 玩家 · 大小 · 尺寸，下面跟状态徽章
    var metaCell = document.createElement('td');
    metaCell.className = 'adm-col-meta';
    var metaText = (item.player || '?') + ' · ' + fmtSize(item.bytes);
    if (item.width > 0 && item.height > 0) {
      metaText += ' · ' + item.width + 'x' + item.height;
    }
    metaCell.appendChild(document.createTextNode(metaText));
    var badge = document.createElement('span');
    var statusKey = STATUS_KEY[item.status];
    badge.className = 'adm-badge adm-' + item.status;
    badge.textContent = statusKey ? t(statusKey) : item.status;
    metaCell.appendChild(document.createElement('br'));
    metaCell.appendChild(badge);
    tr.appendChild(metaCell);

    var actionCell = document.createElement('td');
    actionCell.className = 'adm-col-actions';
    actionCell.appendChild(actionsFor(item));
    tr.appendChild(actionCell);

    return tr;
  }

  /* ------------------------------------------------------ 单张卡片 */

  function card(item) {
    var box = document.createElement('div');
    box.className = 'adm-card';

    box.appendChild(thumbLink(item, 'adm-thumb'));

    var body = document.createElement('div');
    body.className = 'adm-body';

    var name = document.createElement('code');
    name.className = 'adm-name';
    name.textContent = item.name;
    body.appendChild(name);

    var meta = document.createElement('p');
    meta.className = 'adm-meta muted';
    // 一行里把「谁传的、叫什么、多大、多大尺寸」说清楚，不用点进去看。
    // 宽高可能是 0：补登记的老图如果读不出尺寸（文件坏了、扩展名和内容对不上），
    // 就别显示，否则界面上会出现 "· 0x0" 这种看着像坏了的字样。
    var metaText = (item.player || '?');
    if (item.nickname) {
      metaText += ' · ' + item.nickname;
    }
    metaText += ' · ' + fmtSize(item.bytes);
    if (item.width > 0 && item.height > 0) {
      metaText += ' · ' + item.width + 'x' + item.height;
    }
    meta.textContent = metaText;
    body.appendChild(meta);

    // 原始文件名和昵称不一样时才单独占一行 —— 玩家改过昵称的话，
    // 这一行就是「这张图当初是哪个文件」的唯一线索。
    if (item.original_name && item.original_name !== item.nickname) {
      var orig = document.createElement('p');
      orig.className = 'adm-meta muted';
      orig.textContent = t('common.originalFileName') + ': ' + item.original_name;
      body.appendChild(orig);
    }

    var badge = document.createElement('span');
    var statusKey = STATUS_KEY[item.status];
    badge.className = 'adm-badge adm-' + item.status;
    badge.textContent = statusKey ? t(statusKey) : item.status;
    body.appendChild(badge);

    body.appendChild(actionsFor(item));

    box.appendChild(body);
    return box;
  }

  /**
   * 缩略图做成链接：点一下在新标签页打开原图。
   *
   * 网格里的预览只有两三百像素，看不清细节是必然的 —— 与其把缩略图做得更大，
   * 不如给一个直接看原图的入口。
   */
  function thumbLink(item, cls) {
    var href = item.url || ('/preview/' + encodeURIComponent(item.name));
    var a = document.createElement('a');
    a.href = href;
    a.className = 'adm-thumb-link';
    a.title = t('site.admin_clickToPreview');
    a.addEventListener('click', function (e) {
      // 普通左键：页面内看原图；Ctrl/Shift/中键：照旧在新标签页打开
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) {
        return;
      }
      e.preventDefault();
      openLightbox(item);
    });
    var img = document.createElement('img');
    img.className = cls;
    img.loading = 'lazy';
    img.src = href;
    img.alt = item.name;
    a.appendChild(img);
    return a;
  }

  /**
   * 原图预览。网格里的缩略图只有两三百像素，认不出细节是必然的，
   * 所以点开一个占满屏幕的浮层直接看原图，不用另开标签页。
   */
  function openLightbox(item) {
    var href = item.url || ('/preview/' + encodeURIComponent(item.name));
    lightboxImg.src = href;
    lightboxImg.alt = item.name;
    var parts = [item.name];
    if (item.player) {
      parts.push(item.player);
    }
    if (item.width > 0 && item.height > 0) {
      parts.push(item.width + 'x' + item.height);
    }
    lightboxCaption.textContent = parts.join(' · ');
    lightbox.hidden = false;
  }

  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImg.removeAttribute('src');
  }

  // 点哪里都关（图片本身也是关闭热区，不然大图会挡住背后的区域）
  lightbox.addEventListener('click', closeLightbox);

  /**
   * 一张图能做的操作。卡片和列表共用同一套，免得两边按钮长得不一样。
   *
   * 已发布的图**只留删除**：拒绝会把文件从 Images 目录挪走，已经贴在地图上的画
   * 会直接变空白，这不该是个顺手就能点的按钮。
   */
  function actionsFor(item) {
    var actions = document.createElement('div');
    actions.className = 'adm-actions';

    if (item.status !== 'published') {
      actions.appendChild(button(t('site.admin_approve'), 'btn-primary',
        function () { act('approve', item.name, this); }));
    }
    if (item.status === 'pending') {
      actions.appendChild(button(t('site.admin_reject'), 'btn',
        function () { act('reject', item.name, this); }));
    }
    actions.appendChild(button(t('site.admin_delete'), 'btn btn-danger',
      function () { act('delete', item.name, this); }));
    return actions;
  }

  function button(label, cls, onClick) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'btn btn-sm ' + cls;
    el.textContent = label;
    el.addEventListener('click', onClick);
    return el;
  }

  function act(action, name, el) {
    // 拒绝只是把文件挪到 rejected，问一句就行
    if (action === 'reject') {
      askConfirm(t('site.admin_rejectConfirmTitle'),
        t('site.admin_rejectConfirm', { name: name }),
        t('site.admin_reject'),
        function () { send('reject', name, el); });
      return;
    }
    if (action === 'delete') {
      // 删除是不可逆的，而且这张图可能正被摆在游戏里 —— 那边一删就刷报错。
      // 所以先问 Images 的数据库，把具体位置查出来再弹确认。
      req('GET', '/admin/api/usage?name=' + encodeURIComponent(name), undefined)
        .then(function (r) {
          if (r.status === 401) { showLogin(); return; }
          showDeleteConfirm(name, el, r.ok ? r.data : null);
        })
        .catch(function () {
          showDeleteConfirm(name, el, null);
        });
      return;
    }
    send(action, name, el);
  }

  /**
   * 删除确认。查到了放置位置就写进弹窗里，让人知道删掉之后哪里的画会坏。
   *
   * info 为 null 表示连查询都没成功 —— 这种情况也要说清楚，不能装作没事。
   */
  function showDeleteConfirm(name, el, info) {
    var text = t('site.admin_deleteConfirm', { name: name });
    if (info && info.available && info.in_use) {
      // 一张大图会跨几十个地图格，位置上只列前三个，后面用总数带过
      var labels = (info.places || []).slice(0, 3).map(function (p) { return p.label; });
      var extra = (info.total || 0) > labels.length ? ' …(+' + ((info.total || 0) - labels.length) + ')' : '';
      text += ' ' + t('site.admin_deleteInUse', { places: labels.join(' · ') + extra });
    } else if (info && !info.available) {
      text += ' ' + t('site.admin_deleteUsageUnknown', { reason: info.reason || '?' });
    }
    askConfirm(t('site.admin_deleteConfirmTitle'), text, t('site.admin_delete'),
      function () { send('delete', name, el); });
  }

  /** 真正发请求。弹窗确认后才走到这里。 */
  function send(action, name, el) {
    el.disabled = true;
    req('POST', '/admin/api/' + action, { name: name }).then(function (r) {
      el.disabled = false;
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) { setMsg(listMsg, serverText(r.data, 'err.internal')); return; }
      loadList();
    }).catch(function () {
      el.disabled = false;
      setMsg(listMsg, t('common.netError'));
    });
  }

  /* ------------------------------------------------------ 确认弹窗 */

  var pendingConfirm = null;

  /**
   * 不用 window.confirm：那个在部分内嵌浏览器里会被拦掉，而且没法显示长一点的说明。
   * 这里弹一个页面内的框，确认后执行回调。
   */
  function askConfirm(title, text, okLabel, onOk) {
    confirmTitle.textContent = title;
    confirmText.textContent = text;
    confirmOk.textContent = okLabel;
    confirmBox.hidden = false;
    pendingConfirm = onOk;
    confirmOk.focus();
  }

  function closeConfirm() {
    confirmBox.hidden = true;
    pendingConfirm = null;
  }

  confirmOk.addEventListener('click', function () {
    var fn = pendingConfirm;
    closeConfirm();
    if (fn) {
      fn();
    }
  });

  confirmCancel.addEventListener('click', closeConfirm);

  // 点灰底关掉；Esc 也关
  confirmBox.addEventListener('click', function (e) {
    if (e.target === confirmBox) {
      closeConfirm();
    }
  });

  // 视图切换：只改 localStorage 和重绘，不用重新请求
  viewTabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var next = btn.getAttribute('data-view') === 'list' ? 'list' : 'grid';
      if (next === state.view) {
        return;
      }
      state.view = next;
      try {
        window.localStorage.setItem(VIEW_KEY, next);
      } catch (e) {
        // 隐私模式下 localStorage 可能不可用，忽略即可 —— 只是记不住选择
      }
      render();
    });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') {
      return;
    }
    if (!confirmBox.hidden) {
      closeConfirm();
    }
    if (!lightbox.hidden) {
      closeLightbox();
    }
  });

  bulkBtn.addEventListener('click', function () {
    bulkBtn.disabled = true;
    req('POST', '/admin/api/approve-all', {}).then(function (r) {
      bulkBtn.disabled = false;
      if (r.status === 401) { showLogin(); return; }
      if (!r.ok) { setMsg(listMsg, serverText(r.data, 'err.internal')); return; }
      loadList();
    }).catch(function () {
      bulkBtn.disabled = false;
      setMsg(listMsg, t('common.netError'));
    });
  });

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      state.filter = tab.getAttribute('data-filter') || 'all';
      loadList();
    });
  });

  function fmtSize(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) { return n + ' B'; }
    if (n < 1024 * 1024) { return (n / 1024).toFixed(1) + ' KB'; }
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  /* 切语言时重画（服务端文案在页面上由引擎还原，这里只管 JS 生成的） */
  window.addEventListener('imgup:languagechange', function () {
    render();
    setMsg(loginMsg, loginMsg.classList.contains('hidden') ? '' : loginMsg.textContent);
    bulkBtn.textContent = t('site.admin_bulk_approve');
  });

  checkAuth();
})();
</script>

</body>
</html>
