# ============================================================================
# ImgUp —— 图片上传站（整个网站就跑在这个插件里）
# ============================================================================
#
# 改完用 /imgup reload（游戏内或控制台）即可生效。
# 例外：web.port 改了必须重启服务端（端口是在插件启用时绑定的）。
#
# 这个插件不需要 Docker、不需要 Python、不需要 RCON，也没有 shared_secret ——
# 网页和插件在同一个进程里，直接内存通信。

# ---------------------------------------------------------------------------
# 网站本体
# ---------------------------------------------------------------------------
web:
  # 是否启用内置网站。关掉后插件只剩 /imgup 指令，完全不开放任何端口。
  enabled: true

  # 监听端口。★ 想让玩家从外网访问就改这里，
  # 并确认防火墙 / 云安全组放行了它。8091 目前是通的。
  port: 8091

  # 监听地址。
  #   0.0.0.0   = 所有网卡，公网可达（默认）
  #   127.0.0.1 = 只允许本机访问（配合 Nginx 反代时用这个）
  host: "0.0.0.0"

  # 对外访问地址，用于拼图片链接和复制给玩家的指令，必须玩家能访问到。
  # 留空则按 host:port 推断；host 是 0.0.0.0 时会推成 127.0.0.1（玩家访问不了），
  # 所以对外服务时建议显式填，例如 http://110.42.109.54:8091 或 https://img.example.com
  public_base_url: "http://110.42.109.54:8091"

  # true  = 玩家上传后立刻发布，可以直接在游戏里贴（默认，省事）
  # false = 先进待审核，站长用 /imgup list 查看、/imgup ok <文件名> 通过
  auto_publish: true

  # 单个请求的处理超时（秒）。传大图时别设太小。
  request_timeout_seconds: 60

# ---------------------------------------------------------------------------
# 网站上的文字元素
#
# ★ 这些就是页面上显示给玩家的文案，全部可以在这里改，不用碰 HTML。
#
# 支持中英双语。写作规则：
#   site.xxx       = 中文（也就是默认语言）
#   site.xxx_en    = 英文（留空或不写，英文界面就沿用中文）
# 玩家在网页右上角切换语言，切到英文时读 _en 的值。
# ---------------------------------------------------------------------------
site:
  # 浏览器标签页标题
  title: "图片上传站"
  title_en: "Image Upload"

  # 左上角站名（每个页面顶栏都显示）
  brand: "图片上传站"
  brand_en: "Image Upload"

  # 顶栏右侧那个链接的文字。默认指向站长后台。
  nav_admin: "站长入口"
  nav_admin_en: "Admin"

  # ---------------- 首页：获取上传码 ----------------
  home_heading: "上传海报"
  home_heading_en: "Upload a poster"

  home_lede: "先在网页上获取一个 8 位上传码，再进游戏输入 /imgup 你的上传码 完成确认，就可以上传图片了。"
  home_lede_en: "Get an 8-character upload code here, then type /imgup <your code> in game to confirm. After that you can upload images."

  home_step1_title: "第一步 · 获取上传码"
  home_step1_title_en: "Step 1 · Get an upload code"

  home_button: "获取上传码"
  home_button_en: "Get upload code"

  home_step2_title: "备用方式 · 手动输入上传码"
  home_step2_title_en: "Fallback · enter the code manually"

  # ---------------- 上传页 ----------------
  upload_heading: "上传图片"
  upload_heading_en: "Upload an image"

  upload_lede: "选一张截图或海报，上传后会生成游戏内可用的图片名。"
  upload_lede_en: "Pick a screenshot or poster. After uploading you get a file name that works in game."

  upload_button: "上传"
  upload_button_en: "Upload"

  # 昵称输入框上面的标题
  upload_nickname_title: "图片昵称"
  upload_nickname_title_en: "Image nickname"

  # ---------------- 结果页 ----------------
  result_heading: "上传完成"
  result_heading_en: "Upload complete"

  # 改名区块的标题（只有待审核的图才显示这一块）
  result_rename_title: "不满意这个名字？现在还能改"
  result_rename_title_en: "Not happy with this name? You can still change it"

  result_rename_button: "保存新名字"
  result_rename_button_en: "Save new name"

  # ---------------- 页脚 ----------------
  footer_note: "图片上传站 · 深色 Minecraft 风格 · 纯静态页面，不加载任何外部资源。"
  footer_note_en: "Image Upload · dark Minecraft style · fully self-contained, no external assets."

  # 注意：这句话中间夹着一个指令名（页面上是高亮的 <code>），所以拆成前后两半。
  # 拼接后是：<前>images.command.create<后>
  footer_permission: "游戏内贴海报需要 "
  footer_permission_en: "Posting in game requires the "

  footer_permission_suffix: " 权限，没有权限请找站长。"
  footer_permission_suffix_en: " permission — ask your admin if you do not have it."

  # ---------------- 功能开关（关掉对应区块就不显示）----------------
  # 是否显示「备用方式 · 手动输入上传码」那一块
  show_manual_claim: true

  # 是否允许玩家上传后改名
  allow_rename: true

  # 是否在页面上显示「复制文件名 / 复制指令」按钮
  show_copy_buttons: true

# ---------------------------------------------------------------------------
# 图片处理
# ---------------------------------------------------------------------------
upload:
  # 单张图片的体积上限（字节）。5MB = 5242880
  max_upload_bytes: 5242880

  # 长边像素上限，超过会等比缩小（只缩不放）。2048 足够贴海报。
  max_dimension: 2048

  # 总像素上限，防止「解压炸弹」（小文件解出几亿像素把内存撑爆）。
  max_pixels: 40000000

  # JPEG 重新编码的质量（1-100）。90 肉眼几乎无损，文件也不大。
  jpeg_quality: 90

  # 生成的文件名总长上限（含扩展名）。游戏内要手输，别太长。
  max_name_length: 64

  # 玩家能填的昵称长度上限。
  max_nickname_length: 32

# 上传码有效期（秒）。太短玩家来不及切窗口，太长则过期的码还能被拿来试。
code_ttl_seconds: 300

limits:
  # 每个玩家 24 小时内的上传张数上限，0 = 不限。
  per_player_daily: 20

  # 待审核队列上限（auto_publish: false 时才起作用），0 = 不限。
  global_pending_max: 200

  # 每个 IP 每小时能取多少次上传码，防止刷码。
  newcode_per_ip_per_hour: 30

# 是否要求 imgup.use 权限才能用 /imgup 确认上传码。
# false = 所有人可用；true = 需要在 LuckPerms 里发 imgup.use。
require_permission: false

# 玩家上传成功 / 审核结果出来时，是否在游戏内私聊通知玩家。
notify_player: true
