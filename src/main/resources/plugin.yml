name: ImgUp
version: 1.0.0
main: com.huhumc.imgup.ImgUpPlugin
api-version: '1.21'
authors: [ huhumc ]
description: 图片上传站的服务端一半：玩家用 /imgup <上传码> 完成绑定
website: https://huhumc.top
commands:
  imgup:
    description: 确认海报上传码 / 服务端管理接口
    usage: /imgup <上传码>
    aliases: [ imgup ]
permissions:
  imgup.use:
    description: 允许使用 /imgup 确认上传码
    default: true
