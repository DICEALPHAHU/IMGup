# ImgUp 中文文案
#
# 这个文件里的键必须和 messages/ 下其它语言文件一一对应 —— 缺哪个键，
# 那个语言下就会回退到默认语言（config.yml 的 language）。
# 
# 页面上的文字、报错提示、状态说明全部在这里，改完 /imgup reload 生效。
# 想加一门语言：复制一份改名（比如 jp.yml），把值换成日文即可，
# 玩家在网页右上角的语言开关里会自动多出这一项。

# ---------------------------------------------------------------- 这个语言自己的名字 --
# meta.name 会显示在网页右上角的语言开关上（写这门语言自己的叫法）。
meta.name: "中文（简体）"
meta.code: "zh"

